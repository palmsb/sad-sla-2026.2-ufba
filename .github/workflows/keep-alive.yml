# Mantém o projeto gratuito do Supabase ativo (ele pausa após ~7 dias sem uso).
# Lê a URL e a chave PÚBLICA de docs/js/config.js, então não precisa de segredos.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 12 */2 * *"   # a cada 2 dias, ao meio-dia (UTC)
  workflow_dispatch:          # permite rodar manualmente na aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Consultar o banco
        run: |
          URL=$(grep -oP "url:\s*'\K[^']+" docs/js/config.js)
          KEY=$(grep -oP "chave:\s*'\K[^']+" docs/js/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ] || echo "$URL$KEY" | grep -q "COLE_AQUI"; then
            echo "docs/js/config.js ainda não foi preenchido."; exit 1
          fi
          STATUS=$(curl -s -o resposta.json -w "%{http_code}" \
            "$URL/rest/v1/ping?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Resposta do Supabase: HTTP $STATUS"
          cat resposta.json; echo
          if [ "$STATUS" != "200" ]; then
            echo "Falhou. Confira se o projeto está pausado e se o arquivo database/04_keepalive.sql foi executado."
            exit 1
          fi
